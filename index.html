<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8" />
<title>Usman Trade Ledger — Complete Inventory & Profit Management</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Inter', sans-serif; background-color: #F6F3EA; color: #16201C; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th { text-align: left; padding: 10px 14px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: #5B6660; border-bottom: 1px solid #DCD5C4; background: #EFEADB; }
  td { padding: 10px 14px; border-bottom: 1px solid #DCD5C4; }
  input, select { width: 100%; padding: 9px 10px; border: 1px solid #DCD5C4; border-radius: 4px; font-size: 13.5px; font-family: 'Inter', sans-serif; outline: none; background: #fff; }
  button { cursor: pointer; font-family: 'Inter', sans-serif; border-radius: 4px; font-weight: 600; }
  .btn-primary { background: #16201C; color: #F6F3EA; border: none; padding: 9px 16px; font-size: 13.5px; display: inline-flex; align-items: center; gap: 6px; }
  .btn-ghost { background: transparent; color: #5B6660; border: 1px solid #DCD5C4; padding: 6px 10px; font-size: 12px; }
  .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; padding: 3px 8px; border-radius: 20px; }
  .badge-danger { background: #FDE8E8; color: #9B1C1C; }
  .badge-success { background: #DEF7EC; color: #03543F; }
  .alert-banner { background: #FDE8E8; border: 1px solid #F8B4B4; color: #9B1C1C; padding: 12px 16px; border-radius: 6px; margin-bottom: 20px; font-weight: 500; display: flex; align-items: center; gap: 10px; }
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useMemo } = React;

const STORE_KEY = "usman_trade_ledger_v5";
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const money = (n) => (Number(n) || 0).toLocaleString("en-US", { style: "currency", currency: "USD" });

const defaultItems = [
  { id: "i1", name: "Y2K Shirt", sku: "Y2K-01" },
  { id: "i2", name: "Cotton T-Shirt", sku: "TS-02" },
  { id: "i3", name: "Denim Jeans", sku: "DJ-03" }
];

function App() {
  const [data, setData] = useState(() => {
    const raw = localStorage.getItem(STORE_KEY);
    return raw ? JSON.parse(raw) : { 
      suppliers: [{ id: "s1", name: "Default Supplier" }], 
      items: defaultItems,
      purchases: [], 
      dispatches: [], 
      expenses: [], 
      partnerPayouts: [] 
    };
  });

  const [tab, setTab] = useState("dashboard");
  const [modal, setModal] = useState(null);
  const [editItem, setEditItem] = useState(null);

  useEffect(() => {
    localStorage.setItem(STORE_KEY, JSON.stringify(data));
  }, [data]);

  const itemStockMap = useMemo(() => {
    const map = {};
    (data.items || []).forEach(item => {
      map[item.id] = { ...item, purchased: 0, dispatched: 0, stock: 0 };
    });

    data.purchases.forEach(p => {
      if (map[p.itemId]) {
        map[p.itemId].purchased += Number(p.qty) || 0;
      }
    });

    data.dispatches.forEach(d => {
      if (map[d.itemId]) {
        map[d.itemId].dispatched += Number(d.qty) || 0;
      }
    });

    Object.keys(map).forEach(id => {
      map[id].stock = map[id].purchased - map[id].dispatched;
    });

    return map;
  }, [data.items, data.purchases, data.dispatches]);

  const lowStockItems = useMemo(() => {
    return Object.values(itemStockMap).filter(item => item.stock <= 5);
  }, [itemStockMap]);

  const totals = useMemo(() => {
    let totalSales = data.dispatches.reduce((acc, d) => acc + Number(d.totalValue), 0);
    let totalCostOfGoods = data.purchases.reduce((acc, p) => acc + (p.qty * p.rate), 0);
    let totalExpenses = data.expenses.reduce((acc, e) => acc + Number(e.amount), 0);

    let grossProfit = totalSales - totalCostOfGoods;
    let partner25Share = grossProfit > 0 ? grossProfit * 0.25 : 0;
    let owner75Gross = grossProfit > 0 ? grossProfit * 0.75 : grossProfit;
    let ownerNetProfit = owner75Gross - totalExpenses;

    let partnerPaid = data.partnerPayouts.reduce((acc, p) => acc + Number(p.amount), 0);
    let partnerPending = partner25Share - partnerPaid;

    return {
      totalSales, totalCostOfGoods, grossProfit,
      partner25Share, owner75Gross, totalExpenses, ownerNetProfit,
      partnerPaid, partnerPending
    };
  }, [data.dispatches, data.purchases, data.expenses, data.partnerPayouts]);

  const saveRecord = (type, record) => {
    setData(prev => {
      const list = prev[type] || [];
      const exists = list.some(item => item.id === record.id);
      const updated = exists ? list.map(item => item.id === record.id ? record : item) : [record, ...list];
      return { ...prev, [type]: updated };
    });
    setModal(null);
    setEditItem(null);
  };

  const deleteRecord = (type, id) => {
    if (confirm("Kya aap is record ko delete karna chahte hain?")) {
      setData(prev => ({ ...prev, [type]: prev[type].filter(item => item.id !== id) }));
    }
  };

  return (
    <div style={{ display: "flex", minHeight: "100vh" }}>
      <aside style={{ width: 240, background: "#16201C", color: "#F6F3EA", padding: 20 }}>
        <h2 style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 18, margin: "0 0 20px 0" }}>Usman Trade Ledger</h2>
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {[
            { id: "dashboard", label: "📊 Dashboard" },
            { id: "items", label: "📦 Items (Inventory Master)" },
            { id: "suppliers", label: "🏢 Suppliers & Purchases" },
            { id: "dispatches", label: "🚚 Sales / Dispatches" },
            { id: "accounts", label: "💸 Expenses" },
            { id: "partner", label: "🤝 Partner Profit (25%)" }
          ].map(t => (
            <button key={t.id} onClick={() => setTab(t.id)} style={{
              background: tab === t.id ? "rgba(246,243,234,0.15)" : "transparent",
              color: "#F6F3EA", border: "none", padding: "10px 12px", textAlign: "left", borderRadius: 4, cursor: "pointer"
            }}>
              {t.label}
            </button>
          ))}
        </div>
      </aside>

      <main style={{ flex: 1, padding: 30 }}>
        {lowStockItems.length > 0 && (
          <div className="alert-banner">
            ⚠️ <strong>Low Stock Alert:</strong>
            {lowStockItems.map(i => `${i.name} (${i.stock} remaining)`).join(" | ")}
          </div>
        )}

        <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 15, marginBottom: 25 }}>
          <StatBox label="Total Sales Value" value={money(totals.totalSales)} color="#2F6B4F" />
          <StatBox label="Partner 25% Share" value={money(totals.partner25Share)} color="#C8842A" />
          <StatBox label="Owner Expenses" value={money(totals.totalExpenses)} color="#A6462B" />
          <StatBox label="My Net Profit" value={money(totals.ownerNetProfit)} color="#2F6B4F" />
        </div>

        {tab === "dashboard" && (
          <div>
            <h3>Dashboard Overview</h3>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 20 }}>
              <Card title="Current Stock Status">
                <table>
                  <thead><tr><th>Item</th><th>Purchased</th><th>Sold</th><th>Available Stock</th></tr></thead>
                  <tbody>
                    {Object.values(itemStockMap).map(item => (
                      <tr key={item.id}>
                        <td><strong>{item.name}</strong></td>
                        <td>{item.purchased}</td>
                        <td>{item.dispatched}</td>
                        <td>
                          <span className={`badge ${item.stock <= 5 ? "badge-danger" : "badge-success"}`}>
                            {item.stock} Units
                          </span>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </Card>

              <Card title="Profit Summary">
                <div style={{ lineHeight: 1.8, fontSize: 14 }}>
                  <div><strong>Total Sales:</strong> {money(totals.totalSales)}</div>
                  <div><strong>Total Cost of Goods:</strong> -{money(totals.totalCostOfGoods)}</div>
                  <hr/>
                  <div><strong>Gross Profit:</strong> {money(totals.grossProfit)}</div>
                  <div style={{ color: "#C8842A" }}><strong>Partner Share (25%):</strong> {money(totals.partner25Share)}</div>
                  <div style={{ color: "#2F6B4F" }}><strong>Owner Share (75%):</strong> {money(totals.owner75Gross)}</div>
                  <div style={{ color: "#A6462B" }}><strong>Owner Expenses:</strong> -{money(totals.totalExpenses)}</div>
                  <hr/>
                  <div style={{ fontSize: 16, color: "#2F6B4F" }}><strong>Owner Net Profit:</strong> {money(totals.ownerNetProfit)}</div>
                </div>
              </Card>
            </div>
          </div>
        )}

        {tab === "items" && (
          <div>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 15 }}>
              <h3>📦 Items (Master Inventory)</h3>
              <button className="btn-primary" onClick={() => { setEditItem(null); setModal("item"); }}>+ Add New Item</button>
            </div>

            <Card title="Items List & Current Inventory Stock">
              <table>
                <thead><tr><th>Item Name</th><th>SKU / Code</th><th>Total Purchased</th><th>Total Sold</th><th>Current Stock</th><th>Actions</th></tr></thead>
                <tbody>
                  {Object.values(itemStockMap).map(item => (
                    <tr key={item.id}>
                      <td><strong>{item.name}</strong></td>
                      <td>{item.sku || "N/A"}</td>
                      <td>{item.purchased}</td>
                      <td>{item.dispatched}</td>
                      <td>
                        <span className={`badge ${item.stock <= 5 ? "badge-danger" : "badge-success"}`}>
                          {item.stock} Pcs {item.stock <= 5 && "(Low)"}
                        </span>
                      </td>
                      <td>
                        <button className="btn-ghost" onClick={() => { setEditItem(item); setModal("item"); }}>✏️ Edit</button>
                        <button className="btn-ghost" style={{ color: "red", marginLeft: 5 }} onClick={() => deleteRecord("items", item.id)}>🗑️</button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </Card>
          </div>
        )}

        {tab === "suppliers" && (
          <div>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 15 }}>
              <h3>🏢 Suppliers & Purchases</h3>
              <div>
                <button className="btn-primary" onClick={() => { setEditItem(null); setModal("supplier"); }} style={{ marginRight: 10 }}>+ Add Supplier</button>
                <button className="btn-primary" onClick={() => { setEditItem(null); setModal("purchase"); }}>+ Add Purchase</button>
              </div>
            </div>

            <Card title="Purchases Log">
              <table>
                <thead><tr><th>Date</th><th>Supplier</th><th>Item</th><th>Qty</th><th>Rate</th><th>Total</th><th>Paid</th><th>Actions</th></tr></thead>
                <tbody>
                  {data.purchases.map(p => {
                    const supp = data.suppliers.find(s => s.id === p.supplierId);
                    const item = data.items.find(i => i.id === p.itemId);
                    return (
                      <tr key={p.id}>
                        <td>{p.date}</td>
                        <td><strong>{supp?.name || "N/A"}</strong></td>
                        <td>{item?.name || "N/A"}</td>
                        <td>{p.qty}</td>
                        <td>{money(p.rate)}</td>
                        <td>{money(p.qty * p.rate)}</td>
                        <td style={{ color: "#2F6B4F" }}>{money(p.paid)}</td>
                        <td>
                          <button className="btn-ghost" onClick={() => { setEditItem(p); setModal("purchase"); }}>✏️ Edit</button>
                          <button className="btn-ghost" style={{ color: "red", marginLeft: 5 }} onClick={() => deleteRecord("purchases", p.id)}>🗑️</button>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </Card>
          </div>
        )}

        {tab === "dispatches" && (
          <div>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 15 }}>
              <h3>🚚 Sales & Dispatches</h3>
              <button className="btn-primary" onClick={() => { setEditItem(null); setModal("dispatch"); }}>+ Log New Sale</button>
            </div>

            <Card title="Sales History">
              <table>
                <thead><tr><th>Date</th><th>Order ID</th><th>Item</th><th>Qty Dispatched</th><th>Total Value</th><th>Received</th><th>Actions</th></tr></thead>
                <tbody>
                  {data.dispatches.map(d => {
                    const item = data.items.find(i => i.id === d.itemId);
                    return (
                      <tr key={d.id}>
                        <td>{d.date}</td>
                        <td><strong>{d.orderId}</strong></td>
                        <td>{item?.name || "N/A"}</td>
                        <td>{d.qty} pcs</td>
                        <td>{money(d.totalValue)}</td>
                        <td>{money(d.received)}</td>
                        <td>
                          <button className="btn-ghost" onClick={() => { setEditItem(d); setModal("dispatch"); }}>✏️ Edit</button>
                          <button className="btn-ghost" style={{ color: "red", marginLeft: 5 }} onClick={() => deleteRecord("dispatches", d.id)}>🗑️</button>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </Card>
          </div>
        )}

        {tab === "accounts" && (
          <div>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 15 }}>
              <h3>Expenses Log</h3>
              <button className="btn-primary" onClick={() => { setEditItem(null); setModal("expense"); }}>+ Log Expense</button>
            </div>
            <Card title="All Expenses">
              <table>
                <thead><tr><th>Date</th><th>Title</th><th>Amount ($)</th><th>Action</th></tr></thead>
                <tbody>
                  {data.expenses.map(e => (
                    <tr key={e.id}>
                      <td>{e.date}</td>
                      <td>{e.title}</td>
                      <td><strong>{money(e.amount)}</strong></td>
                      <td>
                        <button className="btn-ghost" style={{ color: "red" }} onClick={() => deleteRecord("expenses", e.id)}>🗑️ Delete</button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </Card>
          </div>
        )}

        {tab === "partner" && (
          <div>
            <h3>Partner Profit Share (25%)</h3>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 15, marginBottom: 20 }}>
              <StatBox label="Partner Share (25%)" value={money(totals.partner25Share)} color="#C8842A" />
              <StatBox label="Total Paid" value={money(totals.partnerPaid)} color="#2F6B4F" />
              <StatBox label="Remaining Balance" value={money(totals.partnerPending)} color="#A6462B" />
            </div>

            <button className="btn-primary" style={{ marginBottom: 15 }} onClick={() => setModal("payout")}>+ Record Payout</button>

            <Card title="Partner Payout History">
              <table>
                <thead><tr><th>Date</th><th>Amount Paid ($)</th><th>Notes</th><th>Action</th></tr></thead>
                <tbody>
                  {data.partnerPayouts.map(p => (
                    <tr key={p.id}>
                      <td>{p.date}</td>
                      <td><strong>{money(p.amount)}</strong></td>
                      <td>{p.notes || "Payout"}</td>
                      <td>
                        <button className="btn-ghost" style={{ color: "red" }} onClick={() => deleteRecord("partnerPayouts", p.id)}>🗑️ Delete</button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </Card>
          </div>
        )}
      </main>

      {modal === "item" && (
        <Modal title={editItem ? "Edit Item" : "Add New Item"} onClose={() => setModal(null)}>
          <FormItem initial={editItem} onSave={(rec) => saveRecord("items", rec)} />
        </Modal>
      )}

      {modal === "supplier" && (
        <Modal title="Add Supplier" onClose={() => setModal(null)}>
          <FormSupplier onSave={(rec) => saveRecord("suppliers", rec)} />
        </Modal>
      )}

      {modal === "purchase" && (
        <Modal title={editItem ? "Edit Purchase" : "Log New Purchase"} onClose={() => { setModal(null); setEditItem(null); }}>
          <FormPurchase initial={editItem} suppliers={data.suppliers} items={data.items} onSave={(rec) => saveRecord("purchases", rec)} />
        </Modal>
      )}

      {modal === "dispatch" && (
        <Modal title={editItem ? "Edit Sale / Dispatch" : "Log Sale / Dispatch"} onClose={() => { setModal(null); setEditItem(null); }}>
          <FormDispatch initial={editItem} items={data.items} itemStockMap={itemStockMap} onSave={(rec) => saveRecord("dispatches", rec)} />
        </Modal>
      )}

      {modal === "expense" && (
        <Modal title="Add Expense" onClose={() => setModal(null)}>
          <FormExpense onSave={(rec) => saveRecord("expenses", rec)} />
        </Modal>
      )}

      {modal === "payout" && (
        <Modal title="Record Partner Payout" onClose={() => setModal(null)}>
          <FormPayout onSave={(rec) => saveRecord("partnerPayouts", rec)} />
        </Modal>
      )}
    </div>
  );
}

function StatBox({ label, value, color }) {
  return (
    <div style={{ background: "#fff", border: "1px solid #DCD5C4", padding: 15, borderRadius: 4, borderTop: `4px solid ${color}` }}>
      <div style={{ fontSize: 11, color: "#5B6660", textTransform: "uppercase" }}>{label}</div>
      <div style={{ fontSize: 20, fontWeight: "bold", marginTop: 5, fontFamily: "'IBM Plex Mono', monospace" }}>{value}</div>
    </div>
  );
}

function Card({ title, children }) {
  return (
    <div style={{ background: "#fff", border: "1px solid #DCD5C4", borderRadius: 4, padding: 15, marginBottom: 20 }}>
      {title && <h4 style={{ margin: "0 0 12px 0" }}>{title}</h4>}
      {children}
    </div>
  );
}

function Modal({ title, children, onClose }) {
  return (
    <div 
      style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.5)", display: "flex", justifyContent: "center", alignItems: "center", zIndex: 100 }}
      onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}
    >
      <div 
        style={{ background: "#fff", padding: 25, borderRadius: 6, width: 440 }}
        onClick={(e) => e.stopPropagation()}
      >
        <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 15 }}>
          <h4 style={{ margin: 0 }}>{title}</h4>
          <button onClick={onClose} style={{ border: "none", background: "none", cursor: "pointer" }}>❌</button>
        </div>
        {children}
      </div>
    </div>
  );
}

function FormItem({ initial, onSave }) {
  const [name, setName] = useState(initial?.name || "");
  const [sku, setSku] = useState(initial?.sku || "");

  return (
    <div>
      <label>Item Name</label>
      <input value={name} onChange={e => setName(e.target.value)} placeholder="e.g. Y2K Shirt" style={{ marginBottom: 10 }} />
      <label>SKU / Item Code</label>
      <input value={sku} onChange={e => setSku(e.target.value)} placeholder="e.g. Y2K-01" style={{ marginBottom: 15 }} />
      <button className="btn-primary" onClick={() => name && onSave({ id: initial?.id || uid(), name, sku })}>Save Item</button>
    </div>
  );
}

function FormSupplier({ onSave }) {
  const [name, setName] = useState("");
  return (
    <div>
      <label>Supplier Name</label>
      <input value={name} onChange={e => setName(e.target.value)} placeholder="Supplier Name" style={{ marginBottom: 15 }} />
      <button className="btn-primary" onClick={() => name && onSave({ id: uid(), name })}>Save Supplier</button>
    </div>
  );
}

function FormPurchase({ initial, suppliers, items, onSave }) {
  const [supplierId, setSupplierId] = useState(initial?.supplierId || suppliers[0]?.id || "");
  const [itemId, setItemId] = useState(initial?.itemId || items[0]?.id || "");
  const [qty, setQty] = useState(initial?.qty || 10);
  const [rate, setRate] = useState(initial?.rate || 5);
  const [paid, setPaid] = useState(initial?.paid || 0);
  const [date, setDate] = useState(initial?.date || new Date().toISOString().slice(0, 10));

  return (
    <div>
      <label>Date</label>
      <input type="date" value={date} onChange={e => setDate(e.target.value)} style={{ marginBottom: 10 }} />
      <label>Select Supplier</label>
      <select value={supplierId} onChange={e => setSupplierId(e.target.value)} style={{ marginBottom: 10 }}>
        {suppliers.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
      </select>
      <label>Select Item</label>
      <select value={itemId} onChange={e => setItemId(e.target.value)} style={{ marginBottom: 10 }}>
        {items.map(i => <option key={i.id} value={i.id}>{i.name}</option>)}
      </select>
      <label>Quantity</label>
      <input type="number" value={qty} onChange={e => setQty(Number(e.target.value))} style={{ marginBottom: 10 }} />
      <label>Rate ($)</label>
      <input type="number" value={rate} onChange={e => setRate(Number(e.target.value))} style={{ marginBottom: 10 }} />
      <label>Paid Amount ($)</label>
      <input type="number" value={paid} onChange={e => setPaid(Number(e.target.value))} style={{ marginBottom: 15 }} />
      <button className="btn-primary" onClick={() => onSave({ id: initial?.id || uid(), supplierId, itemId, qty, rate, paid, date })}>Save Purchase</button>
    </div>
  );
}

function FormDispatch({ initial, items, itemStockMap, onSave }) {
  const [orderId, setOrderId] = useState(initial?.orderId || "");
  const [itemId, setItemId] = useState(initial?.itemId || items[0]?.id || "");
  const [qty, setQty] = useState(initial?.qty || 1);
  const [totalValue, setTotalValue] = useState(initial?.totalValue || 0);
  const [received, setReceived] = useState(initial?.received || 0);
  const [date, setDate] = useState(initial?.date || new Date().toISOString().slice(0, 10));
  const [error, setError] = useState("");

  const currentAvailableStock = useMemo(() => {
    const itemData = itemStockMap[itemId];
    if (!itemData) return 0;
    const editingOffset = initial && initial.itemId === itemId ? Number(initial.qty) : 0;
    return itemData.stock + editingOffset;
  }, [itemId, itemStockMap, initial]);

  const handleSubmit = () => {
    if (qty > currentAvailableStock) {
      setError(`❌ Error: Insufficient Stock! You have only ${currentAvailableStock} pcs available in inventory.`);
      return;
    }
    setError("");
    onSave({ id: initial?.id || uid(), orderId, itemId, qty, totalValue, received, date });
  };

  return (
    <div>
      {error && <div style={{ background: "#FDE8E8", color: "#9B1C1C", padding: 10, borderRadius: 4, marginBottom: 10, fontSize: 13 }}>{error}</div>}
      
      <label>Date</label>
      <input type="date" value={date} onChange={e => setDate(e.target.value)} style={{ marginBottom: 10 }} />
      
      <label>Order ID</label>
      <input value={orderId} onChange={e => setOrderId(e.target.value)} placeholder="e.g. ORD-1001" style={{ marginBottom: 10 }} />
      
      <label>Select Item</label>
      <select value={itemId} onChange={e => { setItemId(e.target.value); setError(""); }} style={{ marginBottom: 5 }}>
        {items.map(i => <option key={i.id} value={i.id}>{i.name}</option>)}
      </select>
      <div style={{ fontSize: 12, color: currentAvailableStock <= 5 ? "red" : "#2F6B4F", marginBottom: 10, fontWeight: "bold" }}>
        Available Stock: {currentAvailableStock} pcs
      </div>

      <label>Dispatch Quantity (Pcs)</label>
      <input type="number" value={qty} onChange={e => setQty(Number(e.target.value))} style={{ marginBottom: 10 }} />
      
      <label>Total Sales Value ($)</label>
      <input type="number" value={totalValue} onChange={e => setTotalValue(Number(e.target.value))} style={{ marginBottom: 10 }} />
      
      <label>Payment Received ($)</label>
      <input type="number" value={received} onChange={e => setReceived(Number(e.target.value))} style={{ marginBottom: 15 }} />
      
      <button className="btn-primary" onClick={handleSubmit}>Save Dispatch</button>
    </div>
  );
}

function FormExpense({ onSave }) {
  const [title, setTitle] = useState("");
  const [amount, setAmount] = useState(0);
  const [date, setDate] = useState(new Date().toISOString().slice(0, 10));

  return (
    <div>
      <label>Date</label><input type="date" value={date} onChange={e => setDate(e.target.value)} style={{ marginBottom: 10 }} />
      <label>Expense Title</label><input value={title} onChange={e => setTitle(e.target.value)} style={{ marginBottom: 10 }} />
      <label>Amount ($)</label><input type="number" value={amount} onChange={e => setAmount(Number(e.target.value))} style={{ marginBottom: 15 }} />
      <button className="btn-primary" onClick={() => onSave({ id: uid(), title, amount, date })}>Save Expense</button>
    </div>
  );
}

function FormPayout({ onSave }) {
  const [amount, setAmount] = useState(0);
  const [notes, setNotes] = useState("");
  const [date, setDate] = useState(new Date().toISOString().slice(0, 10));

  return (
    <div>
      <label>Date</label><input type="date" value={date} onChange={e => setDate(e.target.value)} style={{ marginBottom: 10 }} />
      <label>Payout Amount ($)</label><input type="number" value={amount} onChange={e => setAmount(Number(e.target.value))} style={{ marginBottom: 10 }} />
      <label>Notes / Description</label><input value={notes} onChange={e => setNotes(e.target.value)} style={{ marginBottom: 15 }} />
      <button className="btn-primary" onClick={() => onSave({ id: uid(), amount, notes, date })}>Record Payout</button>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
